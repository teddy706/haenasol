<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>받아쓰기 퀴즈 - 놀이교육</title>
    <meta name="description" content="재미있는 퀴즈로 배우는 우리말 맞춤법" />
    <style>
      :root {
        --bg: #f5f3ff;
        --bg-accent: radial-gradient(1200px 600px at 10% -10%, #e3f2ff 0%, transparent 60%),
                      radial-gradient(1000px 500px at 110% 0%, #f0eaff 0%, transparent 55%),
                      radial-gradient(800px 400px at 50% 120%, #fff3d9 0%, transparent 55%);
        --card: #ffffff;
        --text: #3b2a3f;
        --muted: #6b5c72;
        --primary: #8e6de5;
        --primary-dark: #7056b8;
        --correct: #58d68d;
        --incorrect: #ff6b6b;
        --shadow: 0 8px 28px rgba(109, 86, 184, 0.15);
        --radius-lg: 20px;
        --radius-sm: 12px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        color: var(--text);
        background: var(--bg);
        background-image: var(--bg-accent);
        line-height: 1.6;
      }

      .wrap { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
      header { padding: 28px 20px 8px; text-align: center; }
      .title { margin: 0; font-size: clamp(28px, 4.5vw, 40px); letter-spacing: 0.5px; line-height: 1.2; text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(142, 109, 229, 0.2); }
      .title .spark { color: var(--primary); }
      main { padding: 24px 18px 32px; }
      footer { text-align: center; padding: 20px 16px 32px; color: var(--muted); font-size: 13px; }

      #quiz-app { max-width: 700px; margin: 0 auto; }
      .quiz-container {
        background: var(--card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 24px clamp(16px, 4vw, 32px);
      }

      /* --- Screens --- */
      .screen { display: none; }
      .screen.active { display: block; }

      /* --- Loader --- */
      .loader {
        text-align: center;
        padding: 40px;
        font-size: 18px;
        font-weight: 700;
        color: var(--muted);
      }
      .loader::before {
        content: '⏳';
        display: block;
        font-size: 40px;
        margin-bottom: 12px;
        animation: spin 1.5s linear infinite;
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* --- Start Screen --- */
      #start-screen h2 { text-align: center; font-size: 24px; color: var(--primary); margin: 0 0 24px; }
      .level-select-wrap { margin-bottom: 20px; }
      .level-select-wrap label { font-weight: 700; margin-bottom: 8px; display: block; }
      #level-select {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        border-radius: var(--radius-sm);
        border: 2px solid #e8e4f5;
        background-color: #fff;
        font-family: inherit;
      }

      /* --- Quiz Screen --- */
      #quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 700;
      }
      #question-counter { color: var(--primary); }
      #score-counter { color: var(--muted); }
      #question-text {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 24px;
        color: var(--primary-dark);
      }
      #options-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .option-btn {
        appearance: none;
        border: 2px solid #e8e4f5;
        background: #fcfbff;
        color: var(--text);
        font-weight: 600;
        border-radius: var(--radius-sm);
        padding: 16px;
        font-size: 17px;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s ease;
      }
      .option-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--primary); background: #f9f7ff; }
      .option-btn.correct { background-color: #e8f9f1; border-color: var(--correct); color: #1e8449; font-weight: 800; }
      .option-btn.incorrect { background-color: #ffeded; border-color: var(--incorrect); color: #c0392b; }
      .option-btn:disabled { cursor: default; }

      /* --- Result Screen --- */
      #result-screen { text-align: center; }
      #result-screen h2 { font-size: 28px; color: var(--primary); margin: 0 0 12px; }
      #final-score { font-size: 20px; margin-bottom: 12px; }
      #result-feedback { font-size: 16px; color: var(--muted); margin-bottom: 24px; }

      /* --- Common Button --- */
      .btn-wrap { text-align: center; margin-top: 24px; }
      .btn {
        appearance: none; border: 0; background: var(--primary); color: #fff; font-weight: 800;
        letter-spacing: 0.3px; border-radius: var(--radius-sm); padding: 14px 20px; font-size: 18px;
        cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        box-shadow: 0 6px 14px rgba(142, 109, 229, 0.35);
        transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
      }
      .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1 class="title"><span class="spark">맞춤법</span> 퀴즈 ✏️</h1>
      </header>

      <main>
        <div id="quiz-app">
          <div class="quiz-container">
            
            <div id="loader" class="screen active">
              <div class="loader">문제 불러오는 중...</div>
            </div>

            <div id="start-screen" class="screen">
              <h2>맞춤법 퀴즈</h2>
              <div class="level-select-wrap">
                <label for="level-select">도전할 급수를 선택하세요!</label>
                <select id="level-select"></select>
              </div>
              <div class="btn-wrap">
                <button id="start-btn" class="btn">퀴즈 시작! 🚀</button>
              </div>
            </div>

            <div id="quiz-screen" class="screen">
              <div id="quiz-header">
                <span id="question-counter"></span>
                <span id="score-counter"></span>
              </div>
              <p id="question-text">다음 중 맞춤법이 올바른 문장을 고르세요.</p>
              <div id="options-container"></div>
            </div>

            <div id="result-screen" class="screen">
              <h2>퀴즈 결과</h2>
              <p id="final-score"></p>
              <p id="result-feedback"></p>
              <div class="btn-wrap">
                <button id="restart-btn" class="btn">다른 급수 선택</button>
                <a href="index.html" class="btn" style="background-color: var(--muted);">처음으로</a>
              </div>
            </div>

          </div>
        </div>
      </main>

      <footer>
        즐거운 공부가 최고의 비밀! 오늘도 화이팅 ✨
      </footer>
    </div>

    <script>
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby202hJSM-NSUd1WcG-nRVqLXe8HN-u1_HY3I-fnhUMkKutzi7rKEMvG9QduB5BiuHd/exec';

      const loader = document.getElementById('loader');
      const startScreen = document.getElementById('start-screen');
      const quizScreen = document.getElementById('quiz-screen');
      const resultScreen = document.getElementById('result-screen');
      const levelSelect = document.getElementById('level-select');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');
      const optionsContainer = document.getElementById('options-container');
      const questionCounter = document.getElementById('question-counter');
      const scoreCounter = document.getElementById('score-counter');

      let allQuestions = [];
      let currentQuestions = [];
      let currentQuestionIndex = 0;
      let score = 0;

      // --- 데이터 로딩 ---
      async function fetchQuestions() {
        try {
          const response = await fetch(WEB_APP_URL);
          const json = await response.json();
          if (json.ok && Array.isArray(json.data)) {
            allQuestions = json.data.filter(q => q.급수 && q.내용); // 유효한 데이터만 필터링
            populateLevels();
            showScreen('start');
          } else {
            handleError('데이터 형식이 올바르지 않습니다.');
          }
        } catch (error) {
          handleError('데이터를 불러오는 데 실패했습니다. 인터넷 연결을 확인해주세요.');
        }
      }

      function populateLevels() {
        const levels = [...new Set(allQuestions.map(q => q.급수))];
        levelSelect.innerHTML = levels
          .map(level => `<option value="${level}">${level}급</option>`)
          .join('');
      }

      // --- 화면 전환 ---
      function showScreen(screenName) {
        [loader, startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
        document.getElementById(`${screenName}-screen`).classList.add('active');
      }

      function handleError(message) {
        loader.innerHTML = `😢<br>${message}`;
      }

      // --- 퀴즈 로직 ---
      function startQuiz() {
        const selectedLevel = levelSelect.value;
        currentQuestions = allQuestions.filter(q => q.급수 == selectedLevel);
        
        // Fisher-Yates shuffle
        for (let i = currentQuestions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
        }

        currentQuestionIndex = 0;
        score = 0;
        showScreen('quiz');
        displayQuestion();
      }

      function displayQuestion() {
        resetOptions();
        if (currentQuestionIndex >= currentQuestions.length) {
          showResult();
          return;
        }

        questionCounter.textContent = `문제 ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
        scoreCounter.textContent = `점수: ${score}`;

        const correctSentence = currentQuestions[currentQuestionIndex].내용;
        const incorrectOptions = generateIncorrectOptions(correctSentence);
        
        const options = shuffleArray([correctSentence, ...incorrectOptions]);

        options.forEach(optionText => {
          const button = document.createElement('button');
          button.textContent = optionText;
          button.classList.add('option-btn');
          button.addEventListener('click', () => selectAnswer(optionText, correctSentence));
          optionsContainer.appendChild(button);
        });
      }

      function selectAnswer(selected, correct) {
        const isCorrect = selected === correct;
        if (isCorrect) score++;

        Array.from(optionsContainer.children).forEach(btn => {
          if (btn.textContent === correct) btn.classList.add('correct');
          else btn.classList.add('incorrect');
          btn.disabled = true;
        });

        setTimeout(() => {
          currentQuestionIndex++;
          displayQuestion();
        }, 1500);
      }

      function showResult() {
        showScreen('result');
        document.getElementById('final-score').textContent = `총 ${currentQuestions.length}문제 중 ${score}개를 맞혔어요!`;
        let feedback = "참 잘했어요! 훌륭해요! 🥳";
        const accuracy = score / currentQuestions.length;
        if (accuracy < 0.5) feedback = "조금 더 연습해볼까요? 화이팅! 💪";
        else if (accuracy < 0.8) feedback = "아는 단어가 점점 많아지고 있어요! 🤩";
        document.getElementById('result-feedback').textContent = feedback;
      }

      function resetOptions() {
        optionsContainer.innerHTML = '';
      }

      // --- 오답 생성기 (핵심 로직) ---
      function generateIncorrectOptions(correctSentence) {
        const incorrectSentences = new Set();
        const mutators = [mutateSpacing, mutateParticles, mutateEndings, mutateTypo];
        let attempts = 0;

        while (incorrectSentences.size < 4 && attempts < 50) {
          let mutated = correctSentence;
          const mutationsToApply = shuffleArray(mutators).slice(0, Math.random() < 0.7 ? 1 : 2);
          for (const mutator of mutationsToApply) {
            mutated = mutator(mutated);
          }

          if (mutated !== correctSentence) {
            incorrectSentences.add(mutated);
          }
          attempts++;
        }

        // Fallback to ensure we always have 4 incorrect options
        const fallbacks = [
          correctSentence.replace(' ', ''), // remove first space
          correctSentence + '다.',
          correctSentence.slice(0, -1),
          correctSentence.split('').reverse().join('') // reverse it
        ];

        let fallbackIndex = 0;
        while (incorrectSentences.size < 4 && fallbackIndex < fallbacks.length) {
            const fallback = fallbacks[fallbackIndex];
            if (fallback !== correctSentence) {
                incorrectSentences.add(fallback);
            }
            fallbackIndex++;
        }

        return Array.from(incorrectSentences);
      }

      const particleMap = { '는': '은', '은': '는', '가': '이', '이': '가', '를': '을', '을': '를', '와': '과', '과': '와', '한테': '에게', '에게': '한테' };
      const endingMap = { '습니다': '읍니다', '어요': '여요', '예요': '에요', '에요': '예요', '습니다': '습니다' };
      const typoMap = { '되': '돼', '돼': '되', 'ㅔ': 'ㅐ', 'ㅐ': 'ㅔ' };

      function mutateParticles(sentence) {
        const words = sentence.split(' ');
        const wordIndex = Math.floor(Math.random() * words.length);
        const targetWord = words[wordIndex];
        for (const key in particleMap) {
          if (targetWord.endsWith(key)) {
            words[wordIndex] = targetWord.slice(0, -key.length) + particleMap[key];
            return words.join(' ');
          }
        }
        return sentence; // 변경 실패시 원본 반환
      }

      function mutateEndings(sentence) {
        for (const key in endingMap) {
          if (sentence.endsWith(key)) {
            return sentence.slice(0, -key.length) + endingMap[key];
          }
        }
        return sentence;
      }

      function mutateTypo(sentence) {
        const chars = sentence.split('');
        const index = Math.floor(Math.random() * chars.length);
        if (typoMap[chars[index]]) {
          chars[index] = typoMap[chars[index]];
          return chars.join('');
        }
        return sentence;
      }

      function mutateSpacing(sentence) {
        const words = sentence.split(' ');
        if (words.length > 1) {
          const index = Math.floor(Math.random() * (words.length - 1));
          // 띄어쓰기 합치기 또는 나누기
          if (Math.random() > 0.5) {
             words[index] = words[index] + words[index+1];
             words.splice(index+1, 1);
          } else {
            const word = words[index];
            if(word.length > 2) {
              const splitPoint = Math.floor(Math.random() * (word.length - 1)) + 1;
              words.splice(index, 1, word.slice(0, splitPoint), word.slice(splitPoint));
            }
          }
          return words.join(' ');
        }
        return sentence;
      }

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      // --- 이벤트 리스너 ---
      startBtn.addEventListener('click', startQuiz);
      restartBtn.addEventListener('click', () => showScreen('start'));

      // --- 초기화 ---
      document.addEventListener('DOMContentLoaded', fetchQuestions);

    </script>
  </body>
</html>
