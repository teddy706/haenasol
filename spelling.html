<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>맞춤법 퀴즈 - 놀이교육</title>
    <meta name="description" content="재미있는 퀴즈로 배우는 우리말 맞춤법" />
    <style>
      :root {
        --bg: #f5f3ff;
        --bg-accent: radial-gradient(1200px 600px at 10% -10%, #e3f2ff 0%, transparent 60%),
                      radial-gradient(1000px 500px at 110% 0%, #f0eaff 0%, transparent 55%),
                      radial-gradient(800px 400px at 50% 120%, #fff3d9 0%, transparent 55%);
        --card: #ffffff;
        --text: #3b2a3f;
        --muted: #6b5c72;
        --primary: #8e6de5;
        --primary-dark: #7056b8;
        --secondary: #ff7ac8;
        --accent: #ffd36e;
        --shadow: 0 8px 28px rgba(109, 86, 184, 0.15);
        --radius-lg: 20px;
        --radius-sm: 12px;
        --correct: #58d68d;
        --incorrect: #ff6b6b;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        color: var(--text);
        background: var(--bg);
        background-image: var(--bg-accent);
        line-height: 1.7;
      }

      .wrap {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header {
        padding: 28px 20px 8px;
        text-align: center;
      }

      .title {
        margin: 0;
        font-size: clamp(28px, 4.5vw, 44px);
        letter-spacing: 0.5px;
        line-height: 1.2;
        text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(142, 109, 229, 0.2);
      }

      .title .spark { color: var(--primary); }

      main { padding: 24px 18px 32px; }

      #quiz-container {
        max-width: 600px;
        margin: 0 auto;
        background: var(--card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 24px clamp(16px, 4vw, 32px);
      }

      #question-text {
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 24px;
      }

      #options-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .option-btn {
        appearance: none;
        border: 2px solid #e8e4f5;
        background: #fcfbff;
        color: var(--text);
        font-weight: 700;
        border-radius: var(--radius-sm);
        padding: 16px;
        font-size: 18px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s ease;
      }

      .option-btn:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
        background: #f9f7ff;
      }

      .option-btn.correct {
        background-color: #e8f9f1;
        border-color: var(--correct);
        color: #1e8449;
      }

      .option-btn.incorrect {
        background-color: #ffeded;
        border-color: var(--incorrect);
        color: #c0392b;
      }

      #feedback-text {
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        margin-top: 20px;
        height: 24px;
      }

      #score-container {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      .btn-wrap { text-align: center; margin-top: 24px; }

      .btn {
        appearance: none;
        border: 0;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.3px;
        border-radius: var(--radius-sm);
        padding: 14px 20px;
        font-size: 18px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 6px 14px rgba(142, 109, 229, 0.35);
        transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
      }

      .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
      .btn:active { transform: translateY(0); }

      footer {
        text-align: center;
        padding: 20px 16px 32px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1 class="title"><span class="spark">맞춤법</span> 퀴즈 ✏️</h1>
      </header>

      <main>
        <div id="quiz-container">
          <div id="score-container">점수: 0 / 0</div>
          <h2 id="question-text"></h2>
          <div id="options-container"></div>
          <p id="feedback-text"></p>
          <div class="btn-wrap">
            <button id="next-btn" class="btn" style="display: none;">다음 문제</button>
            <a href="index.html" class="btn" style="background-color: var(--muted);">🏠 처음으로</a>
          </div>
        </div>
      </main>

      <footer>
        즐거운 공부가 최고의 비밀! 오늘도 화이팅 ✨
      </footer>
    </div>

    <script>
      const questions = [
        {
          question: "엄마가 맛있는 ( )를 만들어 주셨다.",
          options: ["김치찌게", "김치찌개"],
          answer: "김치찌개"
        },
        {
          question: "이따가 저녁에 만나자!",
          options: ["이따가", "있다가"],
          answer: "이따가"
        },
        {
          question: "이건 내 거야. ( ) 만지지 마.",
          options: ["함부로", "함부러"],
          answer: "함부로"
        },
        {
          question: "내일 학교에 ( ) 안 갈 거야?",
          options: ["않", "안"],
          answer: "안"
        },
        {
          question: "( ) 꼭 가고 싶은 곳이 있어.",
          options: ["어떻게", "어떡해"],
          answer: "어떻게"
        }
      ];

      let currentQuestionIndex = 0;
      let score = 0;

      const questionText = document.getElementById('question-text');
      const optionsContainer = document.getElementById('options-container');
      const feedbackText = document.getElementById('feedback-text');
      const nextBtn = document.getElementById('next-btn');
      const scoreContainer = document.getElementById('score-container');

      function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        scoreContainer.textContent = `점수: 0 / ${questions.length}`;
        nextBtn.textContent = "다음 문제";
        nextBtn.style.display = "none";
        showQuestion();
      }

      function showQuestion() {
        resetState();
        const question = questions[currentQuestionIndex];
        questionText.textContent = question.question;

        question.options.forEach(option => {
          const button = document.createElement('button');
          button.textContent = option;
          button.classList.add('option-btn');
          button.addEventListener('click', () => selectOption(button, option));
          optionsContainer.appendChild(button);
        });
      }

      function resetState() {
        nextBtn.style.display = "none";
        feedbackText.textContent = "";
        while (optionsContainer.firstChild) {
          optionsContainer.removeChild(optionsContainer.firstChild);
        }
      }

      function selectOption(button, selectedOption) {
        const question = questions[currentQuestionIndex];
        const correct = selectedOption === question.answer;

        if (correct) {
          score++;
          feedbackText.textContent = "정답이에요! 🎉";
          feedbackText.style.color = var(--correct);
        } else {
          feedbackText.textContent = `아쉬워요! 정답은 '${question.answer}'이에요.`;
          feedbackText.style.color = var(--incorrect);
        }

        Array.from(optionsContainer.children).forEach(btn => {
          if (btn.textContent === question.answer) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('incorrect');
          }
          btn.disabled = true;
        });
        
        scoreContainer.textContent = `점수: ${score} / ${questions.length}`;

        if (currentQuestionIndex < questions.length - 1) {
          nextBtn.style.display = "inline-flex";
        } else {
          nextBtn.textContent = "다시 풀기";
          nextBtn.style.display = "inline-flex";
          feedbackText.textContent = `퀴즈 끝! 총 ${questions.length}문제 중 ${score}개를 맞혔어요!`;
        }
      }

      nextBtn.addEventListener('click', () => {
        if (currentQuestionIndex < questions.length - 1) {
          currentQuestionIndex++;
          showQuestion();
        } else {
          startQuiz();
        }
      });

      startQuiz();
    </script>
  </body>
</html>
