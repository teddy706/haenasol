<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>맞춤법 퀴즈 - 놀이교육</title>
    <meta name="description" content="재미있는 퀴즈로 배우는 우리말 맞춤법" />
    <style>
      :root {
        --bg: #f5f3ff;
        --bg-accent: radial-gradient(1200px 600px at 10% -10%, #e3f2ff 0%, transparent 60%),
                      radial-gradient(1000px 500px at 110% 0%, #f0eaff 0%, transparent 55%),
                      radial-gradient(800px 400px at 50% 120%, #fff3d9 0%, transparent 55%);
        --card: #ffffff;
        --text: #3b2a3f;
        --muted: #6b5c72;
        --primary: #8e6de5;
        --primary-dark: #7056b8;
        --correct: #58d68d;
        --incorrect: #ff6b6b;
        --shadow: 0 8px 28px rgba(109, 86, 184, 0.15);
        --radius-lg: 20px;
        --radius-sm: 12px;
      }

      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--text); background: var(--bg); background-image: var(--bg-accent); line-height: 1.6; }
      .wrap { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
      header { padding: 28px 20px 8px; text-align: center; }
      .title { margin: 0; font-size: clamp(28px, 4.5vw, 40px); letter-spacing: 0.5px; line-height: 1.2; text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(142, 109, 229, 0.2); }
      .title .spark { color: var(--primary); }
      main { padding: 24px 18px 32px; }
      footer { text-align: center; padding: 20px 16px 32px; color: var(--muted); font-size: 13px; }

      #quiz-app { max-width: 700px; margin: 0 auto; }
      .quiz-container { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px clamp(16px, 4vw, 32px); }
      .screen { display: none; }
      .screen.active { display: block; }

      .loader { text-align: center; padding: 40px; font-size: 18px; font-weight: 700; color: var(--muted); }
      .loader::before { content: '⏳'; display: block; font-size: 40px; margin-bottom: 12px; animation: spin 1.5s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      #start-screen h2 { text-align: center; font-size: 24px; color: var(--primary); margin: 0 0 24px; }
      .setting-group { margin-bottom: 24px; }
      .setting-group label { font-weight: 700; margin-bottom: 10px; display: block; font-size: 18px; color: var(--primary-dark); }
      
      .player-select-container, .level-buttons-container { display: flex; gap: 10px; flex-wrap: wrap; }
      .player-btn, .level-btn {
        flex-grow: 1; appearance: none; border: 2px solid #e8e4f5; background: #fcfbff; color: var(--text);
        font-weight: 700; border-radius: var(--radius-sm); padding: 14px; font-size: 18px; cursor: pointer;
        transition: all 0.15s ease;
      }
      .player-btn:hover, .level-btn:hover { transform: translateY(-2px); border-color: var(--primary); }
      .player-btn.active, .level-btn.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }

      #quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
      #quiz-player { color: var(--primary-dark); }
      #question-counter { color: var(--primary); }
      #score-counter { color: var(--muted); }
      #question-text { font-size: 20px; font-weight: 700; text-align: center; margin: 0 0 24px; color: var(--primary-dark); }
      #options-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .option-btn { appearance: none; border: 2px solid #e8e4f5; background: #fcfbff; color: var(--text); font-weight: 600; border-radius: var(--radius-sm); padding: 16px; font-size: 17px; cursor: pointer; text-align: left; transition: all 0.15s ease; }
      .option-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--primary); background: #f9f7ff; }
      .option-btn.correct { background-color: #e8f9f1; border-color: var(--correct); color: #1e8449; font-weight: 800; }
      .option-btn.incorrect { background-color: #ffeded; border-color: var(--incorrect); color: #c0392b; }
      .option-btn:disabled { cursor: default; }

      #result-screen { text-align: center; }
      #result-screen h2 { font-size: 28px; color: var(--primary); margin: 0 0 12px; }
      #final-score { font-size: 20px; margin-bottom: 12px; }
      #result-feedback { font-size: 16px; color: var(--muted); margin-bottom: 24px; }

      .btn-wrap { text-align: center; margin-top: 32px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .btn { appearance: none; border: 0; background: var(--primary); color: #fff; font-weight: 800; letter-spacing: 0.3px; border-radius: var(--radius-sm); padding: 14px 20px; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 14px rgba(142, 109, 229, 0.35); transition: all 0.14s ease; }
      .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
      .btn:disabled { background-color: #d9d2f0; box-shadow: none; cursor: not-allowed; }

      #incorrect-answers {
        margin-top: 24px;
        text-align: left;
      }
      #incorrect-answers h3 {
        font-size: 18px;
        color: var(--primary-dark);
        margin-bottom: 12px;
        text-align: center;
      }
      #incorrect-answers ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #incorrect-answers li {
        background: #f9f7ff;
        border: 1px solid #e8e4f5;
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        margin-bottom: 10px;
      }
      #incorrect-answers li p {
        margin: 0 0 6px;
      }
      #incorrect-answers li p:last-child {
        margin-bottom: 0;
      }
      #incorrect-answers li strong {
        color: var(--incorrect);
      }
      #incorrect-answers li p:last-child strong {
        color: var(--correct);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1 class="title"><span class="spark">맞춤법</span> 퀴즈 ✏️</h1>
      </header>

      <main>
        <div id="quiz-app">
          <div class="quiz-container">
            
            <div id="loader" class="screen active"><div class="loader">문제 불러오는 중...</div></div>

            <div id="start-screen" class="screen">
              <h2>받아쓰기 퀴즈</h2>
              <div class="setting-group">
                <label>누가 풀 건가요?</label>
                <div class="player-select-container">
                  <button class="player-btn" data-player="해나">해나</button>
                  <button class="player-btn" data-player="해솔">해솔</button>
                </div>
              </div>
              <div class="setting-group">
                <label>도전할 급수를 선택하세요!</label>
                <div id="level-buttons-container"></div>
              </div>
              <div class="btn-wrap">
                <button id="start-btn" class="btn" disabled>퀴즈 시작! 🚀</button>
              </div>
            </div>

            <div id="quiz-screen" class="screen">
              <div id="quiz-header">
                <span id="quiz-player"></span>
                <span id="question-counter"></span>
                <span id="score-counter"></span>
              </div>
              <p id="question-text">다음 중 맞춤법과 띄어쓰기가 올바른 문장을 고르세요.</p>
              <div id="options-container"></div>
              <div class="btn-wrap">
                <button id="next-btn" class="btn" style="display: none;">다음 문제</button>
              </div>
            </div>

            <div id="result-screen" class="screen">
              <h2>퀴즈 결과</h2>
              <p id="final-score"></p>
              <p id="result-feedback"></p>
              <div id="incorrect-answers"></div>
              <div class="btn-wrap">
                <button id="restart-btn" class="btn">다른 급수 선택</button>
              </div>
            </div>

            <div class="btn-wrap" style="margin-top: 24px;">
                <a href="index.html" class="btn" style="background-color: var(--muted);">🏠 처음으로</a>
            </div>

          </div>
        </div>
      </main>

      <footer>
        즐거운 공부가 최고의 비밀! 오늘도 화이팅 ✨
      </footer>
    </div>

    <script>
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyV_kpS4F3FDke1oAOR3mXzzdE-CVDe-ChWJVUdat2HAXGkOwqsuQ5T8l0Z5igm7eF0WA/exec';

      const loader = document.getElementById('loader');
      const startScreen = document.getElementById('start-screen');
      const quizScreen = document.getElementById('quiz-screen');
      const resultScreen = document.getElementById('result-screen');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');
      const nextBtn = document.getElementById('next-btn');
      const optionsContainer = document.getElementById('options-container');
      const questionCounter = document.getElementById('question-counter');
      const scoreCounter = document.getElementById('score-counter');
      const playerContainer = document.querySelector('.player-select-container');
      const levelContainer = document.getElementById('level-buttons-container');
      const quizPlayer = document.getElementById('quiz-player');

      let allQuestions = [];
      let currentQuestions = [];
      let currentQuestionIndex = 0;
      let score = 0;
      let currentPlayer = null;
      let selectedLevel = null;
      let quizStartTime;
      let quizDetails = [];

      // --- 데이터 로딩 ---
      async function fetchQuestions() {
        try {
          const response = await fetch(WEB_APP_URL);
          const json = await response.json();
          if (json.ok && Array.isArray(json.data)) {
            allQuestions = json.data.filter(q => q.급수 && q.내용);
            populateLevels();
            showScreen('start');
          } else { handleError('데이터 형식이 올바르지 않습니다.'); }
        } catch (error) { handleError('데이터를 불러오는 데 실패했습니다. 인터넷 연결을 확인해주세요.'); }
      }

      function populateLevels() {
        const levels = [...new Set(allQuestions.map(q => q.급수))].sort((a, b) => a - b);
        levelContainer.innerHTML = '';
        levels.forEach(level => {
          const button = document.createElement('button');
          button.textContent = `${level}급`;
          button.className = 'level-btn';
          button.dataset.level = level;
          levelContainer.appendChild(button);
        });
      }

      // --- 화면 전환 ---
      function showScreen(screenName) {
        [loader, startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
        document.getElementById(`${screenName}-screen`).classList.add('active');
      }

      function handleError(message) { loader.innerHTML = `😢<br>${message}`; }

      // --- 퀴즈 로직 ---
      function startQuiz() {
        if (!currentPlayer || !selectedLevel) return;

        quizStartTime = new Date();
        quizDetails = [];
        currentQuestions = allQuestions.filter(q => q.급수 == selectedLevel);
        for (let i = currentQuestions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
        }

        currentQuestionIndex = 0;
        score = 0;
        quizPlayer.textContent = `도전자: ${currentPlayer}`;
        showScreen('quiz');
        displayQuestion();
      }

      function displayQuestion() {
        optionsContainer.innerHTML = '';
        nextBtn.style.display = 'none';

        if (currentQuestionIndex >= currentQuestions.length) {
          showResult();
          return;
        }

        questionCounter.textContent = `문제 ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
        scoreCounter.textContent = `점수: ${score}`;

        const correctSentence = currentQuestions[currentQuestionIndex].내용;
        const incorrectOptions = generateIncorrectOptions(correctSentence);
        const options = shuffleArray([correctSentence, ...incorrectOptions]);

        options.forEach(optionText => {
          const button = document.createElement('button');
          button.textContent = optionText.replace(/ /g, '␣');
          button.dataset.originalText = optionText; // Store original text
          button.classList.add('option-btn');
          button.addEventListener('click', () => selectAnswer(optionText, correctSentence));
          optionsContainer.appendChild(button);
        });
      }

      function selectAnswer(selected, correct) {
        const isCorrect = selected === correct;
        if (isCorrect) score++;

        quizDetails.push({ question: correct, userAnswer: selected, isCorrect: isCorrect });

        Array.from(optionsContainer.children).forEach(btn => {
          if (btn.dataset.originalText === correct) btn.classList.add('correct');
          else btn.classList.add('incorrect');
          btn.disabled = true;
        });
        
        nextBtn.style.display = 'inline-flex';
        if (currentQuestionIndex >= currentQuestions.length - 1) {
            nextBtn.textContent = '결과 보기 🏆';
        }
      }

      function showResult() {
        const finishedAt = new Date();
        const durationMs = finishedAt - quizStartTime;

        showScreen('result');
        document.getElementById('final-score').textContent = `${currentPlayer}, 총 ${currentQuestions.length}문제 중 ${score}개를 맞혔어요!`;
        let feedback = "참 잘했어요! 훌륭해요! 🥳";
        const accuracy = score / currentQuestions.length;
        if (accuracy < 0.5) feedback = "조금 더 연습해볼까요? 화이팅! 💪";
        else if (accuracy < 0.8) feedback = "아는 단어가 점점 많아지고 있어요! 🤩";
        document.getElementById('result-feedback').textContent = feedback;

        const incorrectAnswersContainer = document.getElementById('incorrect-answers');
        incorrectAnswersContainer.innerHTML = '';
        const incorrectAnswers = quizDetails.filter(detail => !detail.isCorrect);

        if (incorrectAnswers.length > 0) {
          let html = '<h3>다시 확인해봐요!</h3><ul>';
          incorrectAnswers.forEach(answer => {
            html += `<li>
                       <p><strong>오답:</strong> ${answer.userAnswer.replace(/ /g, '␣')}</p>
                       <p><strong>정답:</strong> ${answer.question.replace(/ /g, '␣')}</p>
                     </li>`;
          });
          html += '</ul>';
          incorrectAnswersContainer.innerHTML = html;
        }

        const resultData = {
          type: 'spelling', player: currentPlayer, level: selectedLevel, total: currentQuestions.length, correct: score,
          startedAt: quizStartTime.toISOString(), finishedAt: finishedAt.toISOString(), durationMs: durationMs,
          userAgent: navigator.userAgent, details: quizDetails
        };
        saveResult(resultData);
      }
      
      async function saveResult(data) {
        try {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(data),
            keepalive: true
          });
        } catch (error) { console.error('Error saving result:', error); }
      }

      function checkCanStart() { startBtn.disabled = !(currentPlayer && selectedLevel); }

      // --- 오답 생성기 ---
      /**
       * [메인 함수] 정답 문장을 받아 4개의 그럴듯한 오답 문장 배열을 생성합니다.
       * @param {string} correctSentence - 정답 문장
       * @returns {string[]} - 생성된 4개의 오답 문장 배열
       */
      function generateIncorrectOptions(correctSentence) {
          // --- 데이터 소스 ---
          // 각 데이터는 [정답]: '오답' 또는 ['오답1', '오답2'] 형태로 구성됩니다.

          // 1. 조사 (앞 글자 받침 유무에 따라 혼동하기 쉬운 조사)
          const particleMap = {
              '는': '은', '은': '는', '가': '이', '이': '가', '를': '을', '을': '를',
              '와': '과', '과': '와', '로': '으로', '으로': '로', '랑': '이랑', '이랑': '랑'
          };
          // 2. 어미 (문장 끝맺음 또는 연결 시 자주 틀리는 표현)
          const endingMap = {
              '습니다': '읍니다', '읍니다': '습니다', '어요': '여요', '여요': '어요',
              '예요': '에요', '에요': '예요', '대요': '데요', '데요': '대요',
              '게요': '께요', '께요': '게요', '든지': '던지', '던지': '든지',
              '로서': '로써', '로써': '로서'
          };
          // 3. 발음/모양 오타 (발음이 비슷하거나 모양이 헷갈리는 표현)
          const typoMap = {
              '되': '돼', '돼': '되', 'ㅔ': 'ㅐ', 'ㅐ': 'ㅔ', 'ㅚ': 'ㅙ', 'ㅙ': 'ㅚ',
              '의': '에', '에': '의', 'ㅅ': 'ㅆ', 'ㅆ': 'ㅅ', 'ㅈ': 'ㅊ', 'ㅊ': 'ㅈ',
              'ㄱ': 'ㄲ', 'ㄲ': 'ㄱ', 'ㅂ': 'ㅃ', 'ㅃ': 'ㅂ', 'ㄷ': 'ㄸ', 'ㄸ': 'ㄷ',
              '낫': '낮', '낮': '낫', '않': '안', '안': '않'
          };
          // 4. 의미 혼동 표현 (의미는 다르지만 자주 헷갈리는 단어)
          const commonMistakeMap = {
              '어떻게': '어떡해', '어떡해': '어떻게', '가르치다': '가리키다', '가리키다': '가르치다',
              '맞히다': '맞추다', '맞추다': '맞히다', '바라요': '바래요', '바래요': '바라요',
              '며칠': '몇일', '몇일': '며칠', '이따가': '있다가', '있다가': '이따가',
              '붙이다': '부치다', '부치다': '붙이다'
          };
          // 5. 띄어쓰기 (띄어쓰기를 틀리기 쉬운 표현)
          const spacingMap = {
              '할 수 있다': ['할수있다', '할 수있다'], '뿐만 아니라': ['뿐만아니라', '뿐만 아니라'],
              '보는 대로': ['보는대로', '보는 대로'], '나만큼': ['나 만큼', '나 만큼'],
              '너밖에': ['너 밖에', '너 밖에'], '하는 중': ['하는중', '하는 중']
          };

          // --- 헬퍼 함수 ---
          const shuffleArray = (array) => {
              for (let i = array.length - 1; i > 0; i--) {
                  const j = Math.floor(Math.random() * (i + 1));
                  [array[i], array[j]] = [array[j], array[i]];
              }
              return array;
          };

          // --- 변형(Mutation) 함수들 ---

          /**
           * 맵(Map) 데이터를 기반으로 문장에서 키를 찾아 값으로 치환합니다.
           * 문장 내에서 치환 가능한 모든 경우를 찾은 뒤, 그중 하나를 무작위로 선택하여 변형합니다.
           */
          const mutateByMap = (sentence, map) => {
              const mutations = [];
              for (const [key, value] of Object.entries(map)) {
                  let index = sentence.indexOf(key);
                  while (index !== -1) {
                      const replacement = Array.isArray(value) ? value[Math.floor(Math.random() * value.length)] : value;
                      mutations.push({ index, key, replacement });
                      index = sentence.indexOf(key, index + 1);
                  }
              }
              if (mutations.length === 0) return sentence;

              const mutation = mutations[Math.floor(Math.random() * mutations.length)];
              return sentence.substring(0, mutation.index) + mutation.replacement + sentence.substring(mutation.index + mutation.key.length);
          };

          // 띄어쓰기 변형: spacingMap에 있는 표현을 우선 적용하고, 없으면 임의로 단어를 합치거나 나눕니다.
          const mutateSpacing = (sentence) => {
              const targetedMutation = mutateByMap(sentence, spacingMap);
              if (targetedMutation !== sentence) return targetedMutation;

              const words = sentence.split(' ');
              if (words.length < 2) return sentence;

              const i = Math.floor(Math.random() * (words.length - 1));
              if (Math.random() > 0.5 && words[i].length > 1) { // 단어 나누기
                  const splitPoint = Math.floor(Math.random() * (words[i].length - 1)) + 1;
                  words.splice(i, 1, words[i].substring(0, splitPoint), words[i].substring(splitPoint));
              } else { // 단어 합치기
                  words[i] = words[i] + words[i + 1];
                  words.splice(i + 1, 1);
              }
              return words.join(' ');
          };

          const mutators = [
              mutateSpacing,
              (s) => mutateByMap(s, particleMap),
              (s) => mutateByMap(s, endingMap),
              (s) => mutateByMap(s, typoMap),
              (s) => mutateByMap(s, commonMistakeMap),
          ];

          // --- 메인 로직 ---
          const incorrectSentences = new Set();
          let attempts = 0;

          // 1. 지능적 변형 시도 (오류를 1~2개 조합하여 생성)
          while (incorrectSentences.size < 4 && attempts < 100) {
              let mutated = correctSentence;
              const mutationsToApply = shuffleArray([...mutators]).slice(0, Math.random() < 0.6 ? 1 : 2);

              for (const mutator of mutationsToApply) {
                  mutated = mutator(mutated);
              }

              if (mutated !== correctSentence) {
                  incorrectSentences.add(mutated);
              }
              attempts++;
          }

          // 2. 폴백 로직 (생성된 오답이 4개 미만일 경우, 단일 변형으로 채우기)
          const fallbackMutators = shuffleArray([...mutators]);
          while (incorrectSentences.size < 4 && fallbackMutators.length > 0) {
              const mutator = fallbackMutators.pop();
              const fallback = mutator(correctSentence);
              if (fallback !== correctSentence && !incorrectSentences.has(fallback)) {
                  incorrectSentences.add(fallback);
              }
          }
          
          // 3. 최후의 폴백 (그래도 부족할 경우, 단순한 방법으로 채우기)
          const lastResorts = [
              correctSentence.replace(/ /g, ''), // 모든 띄어쓰기 제거
              correctSentence.slice(0, -1) + '?', // 마지막 글자를 물음표로 바꾸기
          ];
          let i = 0;
          while(incorrectSentences.size < 4 && i < lastResorts.length){
              if(lastResorts[i] !== correctSentence) incorrectSentences.add(lastResorts[i]);
              i++;
          }

          return Array.from(incorrectSentences);
      }


      // --- 이벤트 리스너 ---
      playerContainer.addEventListener('click', e => {
        if (!e.target.matches('.player-btn')) return;
        currentPlayer = e.target.dataset.player;
        document.querySelectorAll('.player-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        checkCanStart();
      });
      levelContainer.addEventListener('click', e => {
        if (!e.target.matches('.level-btn')) return;
        selectedLevel = e.target.dataset.level;
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        checkCanStart();
      });
      startBtn.addEventListener('click', startQuiz);
      restartBtn.addEventListener('click', () => {
        showScreen('start');
        nextBtn.textContent = '다음 문제';
      });
      nextBtn.addEventListener('click', () => {
          currentQuestionIndex++;
          displayQuestion();
      });

      document.addEventListener('DOMContentLoaded', fetchQuestions);
    </script>
  </body>
</html>
